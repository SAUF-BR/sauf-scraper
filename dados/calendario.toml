# Calendário de vestibulares (D-104 a D-106 da API). Como preencher e enviar: dados/README.md,
# seção "Calendário". Um bloco [[evento]] por evento, sempre com a página oficial da data.
# Data que a fonte ainda não publicou ("a divulgar") não entra: fica comentada até sair.
# Conferido em 2026-11-20.
#
# tipo: inscricao, prova, resultado, feira ou outro. inicio/fim: datas do TOML (AAAA-MM-DD),
# sem aspas; sem fim = evento de um dia. sigla = arquivo de dados/ies/; sem sigla = nacional.
# ano = ano da edição (o "2027" de "Vestibular 2027").

